<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Recomendador de Bares y Restaurantes</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="login-container">
    <h1>Iniciar Sesión</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Nombre Usuario:</label>
        <input type="text" id="username" name="username" placeholder="Introduce tu nombre de usuario">
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Introduce tu contraseña">
          <span class="toggle-password" id="togglePassword">👁️</span>
        </div>
      </div>

      <small class="error-message" id="loginError"></small>

      <div class="buttons">
        <button type="submit" class="login-btn" id="inicioCorrecto">Login</button>
        <button type="button" class="register-btn" id="goToRegister">Registrarse</button>
      </div>
    </form>

    <p class="extra-text">Accede para descubrir tus mejores recomendaciones</p>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
