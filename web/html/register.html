<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Recomendador de Bares y Restaurantes</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="login-container register-container">
    <h1>Crear Cuenta</h1>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre de usuario:</label>
        <input type="text" id="name" name="name" placeholder="Introduce tu nombre de usuario">
        <small class="error-message" id="nameError"></small>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        <small class="error-message" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="country">País:</label>
        <select id="country" name="country">
          <option value="">Selecciona tu país</option>
          <option value="España">🇪🇸 España</option>
          <option value="Portugal">🇵🇹 Portugal</option>
          <option value="Francia">🇫🇷 Francia</option>
          <option value="Italia">🇮🇹 Italia</option>
          <option value="Alemania">🇩🇪 Alemania</option>
          <option value="Reino Unido">🇬🇧 Reino Unido</option>
          <option value="México">🇲🇽 México</option>
          <option value="Argentina">🇦🇷 Argentina</option>
          <option value="Colombia">🇨🇴 Colombia</option>
          <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
        </select>
        <small class="error-message" id="countryError"></small>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="city">Ciudad:</label>
          <input type="text" id="city" name="city" placeholder="Introduce tu ciudad">
          <small class="error-message" id="cityError"></small>
        </div>

        <div class="form-group half-width">
          <label for="birthdate">Fecha de nacimiento:</label>
          <input type="date" id="birthdate" name="birthdate">
          <small class="error-message" id="birthdateError"></small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
          <span class="toggle-password" id="togglePassword">👁️</span>
        </div>
        <small class="error-message" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="repeatPassword">Repetir contraseña:</label>
        <div class="password-wrapper">
          <input type="password" id="repeatPassword" name="repeatPassword" placeholder="Repite la contraseña">
          <span class="toggle-password" id="toggleRepeatPassword">👁️</span>
        </div>
        <small class="error-message" id="repeatPasswordError"></small>
      </div>

      <small class="error-message" id="registerError"></small>

      <div class="buttons">
        <button type="submit" class="login-btn">Crear cuenta</button>
        <button type="button" class="register-btn" id="backToLogin">Volver</button>
      </div>
    </form>

    <p class="extra-text">Regístrate para guardar favoritos y recibir recomendaciones personalizadas</p>
  </div>

  <script src="../js/register.js"></script>
</body>
</html>
